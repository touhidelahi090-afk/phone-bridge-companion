name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List repository contents
        run: find . -maxdepth 6 -not -path '*/.git*' | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate the Gradle project directory
        id: locate
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 6 -name 'settings.gradle.kts' | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts anywhere in the repo." >&2
            exit 1
          fi
          echo "Found project at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
